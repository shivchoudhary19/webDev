<!DOCTYPE html>
<html>
<head>
  <style>
    .stage {
      position: relative;
      width: 500px;
      height: 300px;
      border: 2px solid black;
    }

    .box {
      position: absolute;
      width: 50px;
      height: 50px;
      animation: move 6s infinite alternate ease-in-out;
    }

    .box1 {
      background-color: #22C1C3;
    background: linear-gradient(0deg,rgba(34, 193, 195, 1) 0%, rgba(253, 187, 45, 1) 100%);left:0px; top:0px;
    }

    .box2 {
      background: #c32222;
     background: linear-gradient(0deg, rgba(195, 34, 34, 1) 0%, rgba(253, 187, 45, 1) 100%); left:200px; top:0px;
      animation-delay: -1.5s;
    }

    .box3 {
      background:#a32f0b;
background: linear-gradient(90deg, rgba(163, 47, 11, 1) 0%, rgba(19, 242, 112, 1) 50%, rgba(232, 26, 174, 1) 100%);
      animation-delay: -3s;
    }

    .box4 {
      background: #d4de14;
background: linear-gradient(90deg, rgba(212, 222, 20, 1) 0%, rgba(26, 129, 232, 1) 35%, rgba(255, 0, 81, 1) 100%); left:0px; top:0px;
      animation-delay: -4.5s;
    }

    @keyframes move {
      0%   { top: 0px;   left: 0px; }
      25%  { top: 0px;   left: 400px; }
      50%  { top: 200px; left: 400px; }
      75%  { top: 200px; left: 0px; }
      100% { top: 0px;   left: 0px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
  </div>
</body>
</html>
