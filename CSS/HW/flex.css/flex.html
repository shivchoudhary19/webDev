<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Flex Layout</title>
</head>
<style>
.container {
  display: flex;
  flex-direction: column-reverse;
  background-color: rgb(24, 128, 214);
}

.container div {
  background-color: #e6d116;
  width: 100px;
  margin: 10px;
  padding: 10px;
  text-align: center;  
  font-size: 30px;
}
</style>
</head>
<body>

<h1>flex-direction: column</h1>

<p>flex-direction: column; displays the flex items vertically (from top to bottom):</p>

<div class="container">
  <div>1</div>
  <div>2</div>
  <div>3</div>  
  <div>4</div>
</div>

</body>

</html>
