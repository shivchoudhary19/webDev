<!DOCTYPE html>
<html>
<head>
<style>
img {
  position: absolute;
  left: 0px;
  top: 100px;
  z-index: -1;
}
</style>
</head>
<body>

<h1>Z-Indexing the Image</h1>

<img src="https://www.w3schools.com/css/img_tree.png"
     width="300" height="300">

<p>Because the image has a z-index of -1, it will be placed behind the text.</p>

</body>
</html>
