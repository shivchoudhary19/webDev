<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>

    <style>
        .container {
            width: 400px;
            height: 700px;
            border: 3px solid blue;
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-evenly;
            align-items: flex-start;
            padding: 30px;
            box-sizing: border-box;
            margin: 20px;
        }

        .box {
            width: 60px;
            height: 50px;
            border: 2px solid blue;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px;
        }
        h1,h2{
            display:inline-block;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
        <div class="box">D</div>
        <div class="box">E</div>
        <div class="box">F</div>
        <div class="box">G</div>
        <div class="box">H</div>
        <div class="box">I</div>
        <div class="box">J</div>
        <div class="box">K</div>

    </div>
    <h1>Shiv</h1>
    <h2>Choudhary</h2>

</body>
</html>
